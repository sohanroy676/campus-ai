[project]
name = "smartcampus"
version = "0.1.0"
description = "Simulated campus that re-plans rooms, equipment and timing after disruptions with one CP-SAT model."
readme = "AGENTS.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ortools>=9.12,<10",
    "pydantic>=2.8,<3",
    "typer>=0.12",
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
llm = ["openai>=1.40"]

[project.scripts]
smartcampus = "smartcampus.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit",
    # the `api` extra again, so CI type-checks and tests the demo dashboard's API
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smartcampus"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]

# scipy ships no type stubs.
[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

# mypy does not accept `strict = true` per module, so the strict flags are listed explicitly.
[[tool.mypy.overrides]]
module = ["smartcampus.rules.*", "smartcampus.solver.*", "smartcampus.sim.*"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "tests/property"]
addopts = "--strict-markers"
markers = ["slow: takes minutes (large instances); leave out with -m \"not slow\""]
